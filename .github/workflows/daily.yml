name: Daily run

on:
  schedule:
    - cron: "17 13 * * *"   # 13:17 UTC (7:17 a.m. Central), after West Coast games are final
    - cron: "17 21 * * *"   # backup run; a second run the same day just replaces that day
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: daily-run
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Tests
        run: pytest -q

      - name: Fetch, build history, write status, post Issue
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python -m tracker run

      - name: Commit data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "nothing to commit"
          else
            git commit -m "Daily run $(date -u +%F)"
            git pull --rebase
            git push
          fi
