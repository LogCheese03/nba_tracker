name: Daily run

on:
  schedule:
    - cron: "17 13 * * *"   # 13:17 UTC (7:17 a.m. Central), after West Coast games are final
    - cron: "17 21 * * *"   # backup runs: GitHub can delay or skip scheduled runs,
    - cron: "17 5 * * *"    # and a second run on the same day just replaces that day
    - cron: "17 17 * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: daily-run
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-24.04
    env:
      START_DATE: "2026-11-16"   # scheduled runs begin on this UTC date (manual runs always go)
    steps:
      - name: Check start date
        id: gate
        run: |
          if [ "${{ github.event_name }}" = "schedule" ] && [ "$(date -u +%F)" \< "$START_DATE" ]; then
            echo "go=false" >> "$GITHUB_OUTPUT"; echo "Before $START_DATE - skipping scheduled run."
          else
            echo "go=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v5
        if: steps.gate.outputs.go == 'true'

      - uses: actions/setup-python@v6
        if: steps.gate.outputs.go == 'true'
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt
        if: steps.gate.outputs.go == 'true'

      - name: Tests
        if: steps.gate.outputs.go == 'true'
        run: pytest -q

      - name: Fetch, build history, write status, post Issue
        if: steps.gate.outputs.go == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python -m tracker run

      - name: Commit data
        if: steps.gate.outputs.go == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "nothing to commit"
          else
            git commit -m "Daily run $(date -u +%F)"
            git pull --rebase
            git push
          fi
